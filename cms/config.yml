# ============================================================
# Decap CMS config — online editing for ANMO site
# After creating your GitHub repo & Cloudflare Pages, replace:
#   repo:  <your-username>/<your-repo>
#   base_url:  https://<your-domain>
# ============================================================

backend:
  name: github
  repo: disney29/anmo-home-appliances
  branch: main
  base_url: https://www.anmo-kemei.com
  auth_endpoint: api/auth

# media uploads go to assets/uploads (use relative paths in content)
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ---------------- 联系方式与设置 ----------------
  - name: "settings"
    label: "联系方式与设置"
    label_singular: "设置"
    description: "公司信息、联系方式、收款信息、Google Analytics"
    delete: false
    files:
      - name: "settings"
        label: "公司信息 / 联系方式 / 收款"
        file: "data/cms-settings.json"
        fields:
          - { label: "公司名称", name: companyName, widget: string }
          - { label: "Slogan（标语）", name: slogan, widget: string }
          - { label: "邮箱", name: email, widget: string }
          - { label: "WhatsApp 号码（国家码+数字，如 8613665830929）", name: whatsapp, widget: string }
          - { label: "电话", name: phone, widget: string }
          - { label: "地址", name: address, widget: text }
          - { label: "谷歌地图嵌入链接", name: mapEmbed, widget: string }
          - { label: "PayPal 收款邮箱", name: paypal, widget: string }
          - { label: "收款银行名称", name: bankName, widget: string }
          - { label: "收款户名", name: beneficiary, widget: string }
          - { label: "银行账号", name: account, widget: string }
          - { label: "SWIFT 代码", name: swift, widget: string }
          - { label: "Google Analytics ID（填了才启用统计，如 G-XXXXXXX）", name: gaId, widget: string }

  # ---------------- 产品管理 ----------------
  - name: "products"
    label: "产品管理"
    label_singular: "产品"
    description: "增删改产品，保存后自动发布，全站（含 8 国语言）生效"
    delete: false
    files:
      - name: "products"
        label: "产品列表"
        file: "data/cms-products.json"
        fields:
          - label: "产品列表"
            name: products
            widget: list
            summary: "{{fields.name}}"
            collapsed: false
            fields:
              - { label: "产品ID（唯一，如 p17，新增时请用新编号）", name: id, widget: string }
              - { label: "产品名称（英文，默认语言）", name: name, widget: string }
              - label: "分类"
                name: category
                widget: select
                options: ["hair-clipper", "shaver", "trimmer", "beauty", "pet", "hairstyling", "hair-dryer", "accessory"]
              - { label: "主图路径（如 assets/images/product-fridge.jpg，或上传后自动生成路径）", name: image, widget: string }
              - { label: "FOB 价格（美元）", name: price, widget: number, value_type: "float", min: 0 }
              - { label: "起订量 MOQ", name: moq, widget: number, value_type: "int", min: 0 }
              - { label: "电压 / 频率", name: voltage, widget: string }
              - { label: "材质", name: material, widget: string }
              - { label: "容量 / 尺寸", name: capacity, widget: string }
              - { label: "认证（如 CE, CB, RoHS）", name: certs, widget: string }
              - { label: "产品特性（每行一条）", name: features, widget: text }
              - { label: "交期（天）", name: lead, widget: number, value_type: "int", min: 1 }
              - { label: "上架显示", name: active, widget: boolean, default: true }
              - { label: "热门产品（首页/详情标记）", name: hot, widget: boolean, default: false }
              - label: "多语言产品名称"
                name: names
                widget: object
                collapsed: true
                fields:
                  - { label: "English", name: en, widget: string }
                  - { label: "中文", name: zh, widget: string }
                  - { label: "Tiếng Việt", name: vi, widget: string }
                  - { label: "ภาษาไทย", name: th, widget: string }
                  - { label: "Bahasa Indonesia", name: id, widget: string }
                  - { label: "Español", name: es, widget: string }
                  - { label: "Français", name: fr, widget: string }
                  - { label: "Português", name: pt, widget: string }
              - label: "多语言产品描述（可选）"
                name: desc
                widget: object
                collapsed: true
                fields:
                  - { label: "English", name: en, widget: text }
                  - { label: "中文", name: zh, widget: text }
                  - { label: "Tiếng Việt", name: vi, widget: text }
                  - { label: "ภาษาไทย", name: th, widget: text }
                  - { label: "Bahasa Indonesia", name: id, widget: text }
                  - { label: "Español", name: es, widget: text }
                  - { label: "Français", name: fr, widget: text }
                  - { label: "Português", name: pt, widget: text }
              - { label: "图册路径（逗号分隔多张，如 assets/images/p1-a.jpg, assets/images/p1-b.jpg）", name: gallery, widget: string }
              - { label: "产品资料 PDF 路径（如 assets/docs/p1-spec.pdf）", name: datasheet, widget: string }
              - { label: "认证文件 PDF 路径", name: certFile, widget: string }

